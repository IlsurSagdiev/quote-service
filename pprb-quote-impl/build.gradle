plugins {
    id 'org.springframework.boot'
}

configurations {
    all {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
        exclude group: "org.springframework.boot", module: "spring-boot-starter-security"
        exclude group: "org.springdoc", module: "springdoc-openapi-ui"
        exclude group: "org.springframework.boot", module: "spring-boot-starter-log4j2"
    }
    [apiElements, runtimeElements].each {
        it.outgoing.artifacts.removeIf {
            it.buildDependencies.getDependencies(null).contains(jar)
        }
        it.outgoing.artifact(bootJar)
    }
    compileOnly {
        extendsFrom annotationProcessor
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("jar") {
    enabled = false
}

springBoot {
    mainClass = "ru.sberbank.pprb.quote.PprbQuoteServiceApplication"
    buildInfo()
}

bootJar {
    manifest {
        attributes('Implementation-Title': project.name, 'Implementation-Version': project.version)
    }
}

dependencies {
    implementation project(":pprb-quote-api")
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui"

    implementation("org.liquibase:liquibase-core") {
        exclude(group: "org.yaml")
    }
    implementation "org.springframework.kafka:spring-kafka"
    implementation "org.zalando:logbook-spring-boot-starter:$logbookStarterVersion"
    compileOnly "org.mapstruct:mapstruct:${mapstructVersion}"

    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructProcessorVersion}"
    annotationProcessor "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${mapstructBindingVersion}"

    implementation "org.hibernate:hibernate-core:$hibernateCoreVersion"

    compileOnly "org.projectlombok:lombok"
    runtimeOnly "org.postgresql:postgresql"

    testImplementation("org.springframework.boot:spring-boot-starter-test") {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:testcontainers'
}
