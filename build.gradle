plugins {
    id "org.springframework.boot" version "${springBootVersion}" apply false
    id "io.spring.dependency-management" version "1.1.6"
    id "java"
}

version = '0.0.1'

apply from: 'repo.gradle'

allprojects {
    group "ru.sberbank"
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = "UTF-8"
    }
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
    }
}

subprojects {
    apply plugin: "java"
    apply plugin: "io.spring.dependency-management"

    version = rootProject.version
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
        }
        dependencies {
            dependency "org.projectlombok:lombok:$lombokVersion"
            dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:$springdocVersion"
            dependency "io.swagger:swagger-annotations:$swaggerAnnotationsVersion"
            dependency "org.zalando:logbook-spring-boot-starter:$logbookStarterVersion"
            dependency "jakarta.validation:jakarta.validation-api:$jakartaValidationApiVersion"
        }
    }
}
